name: Build deploy branch

# Builds the API jar and the UI bundle, then force-pushes them with a runtime-only Dockerfile
# to the `deploy` branch, which the free host builds from.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build API
        working-directory: backend
        run: ./mvnw -q -B package -DskipTests
      - name: Build UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Assemble deploy tree
        run: |
          mkdir -p out
          cp backend/target/nyayaflow.jar out/app.jar
          cp -r frontend/dist out/html
          cp deploy/single/Dockerfile deploy/single/nginx.conf deploy/single/start.sh out/
          printf '# NyayaFlow deploy build\n\nGenerated by CI from %s. Do not edit; see the main branch.\n' "$GITHUB_SHA" > out/README.md
      - name: Push to deploy branch
        working-directory: out
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
