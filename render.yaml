# Render Blueprint: one click deploys the API (Docker) and the web UI (static site).
# The database is an external PostgreSQL (for example Neon's free tier); paste its
# connection details into DB_URL / DB_USERNAME / DB_PASSWORD when Render asks.
services:
  - type: web
    name: nyayaflow-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false # jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: NYAYAFLOW_JWT_SECRET
        generateValue: true
      - key: NYAYAFLOW_SEED_DEMO_DATA
        value: "true"
      - key: NYAYAFLOW_STORAGE_LOCATION
        value: /tmp/uploads
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"

  - type: web
    name: nyayaflow
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # The browser calls /api on the same origin; Render forwards it to the API service.
      - type: rewrite
        source: /api/*
        destination: https://nyayaflow-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
