worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen __PORT__;
        root /usr/share/nginx/html;

        location /api/ {
            client_max_body_size 21m;
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # The UI and API share one origin behind this proxy, and auth is a bearer token (no cookies),
            # so drop Origin rather than have Spring compare it with the rewritten internal host.
            proxy_set_header Origin "";
            proxy_read_timeout 120s;
        }

        # While the API is still starting, tell the browser instead of a bare 502.
        error_page 502 503 504 = @starting;
        location @starting {
            default_type application/json;
            return 503 '{"status":503,"code":"STARTING","message":"The server is waking up. Please try again in a few seconds."}';
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
